name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        env:
          ENABLE_OTEL: "false"
          DEMO_MODE: "true"
          ADMIN_API_TOKEN: test-admin-token
          RECOVERY_API_TOKEN: test-recovery-token
          ALERT_WEBHOOK_TOKEN: test-alert-token
        run: pytest -q

  responder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: responder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: responder/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, responder, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build images
        run: |
          docker compose build backend frontend responder
