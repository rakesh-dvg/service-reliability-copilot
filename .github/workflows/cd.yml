name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - production
      image_tag:
        description: "Immutable image tag (commit SHA). Leave empty to use github.sha"
        required: false
        type: string
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check deployment secrets
        id: secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured. Skipping deploy (safe no-op)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and tag images
        if: steps.secrets.outputs.configured == 'true'
        run: |
          docker compose build backend frontend responder
          docker tag service-reliability-copilot-backend:latest "src-backend:${{ steps.meta.outputs.tag }}"
          docker tag service-reliability-copilot-frontend:latest "src-frontend:${{ steps.meta.outputs.tag }}"
          docker tag service-reliability-copilot-responder:latest "src-responder:${{ steps.meta.outputs.tag }}"

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '~/service-reliability-copilot' }}"
            export IMAGE_TAG="${{ steps.meta.outputs.tag }}"
            docker compose pull || true
            docker compose up -d
            curl -fsS http://127.0.0.1:8000/health
            curl -fsS http://127.0.0.1:8080/health

      - name: Skip summary
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "CD completed without deployment because repository secrets are absent."
          echo "Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (optional DEPLOY_PATH)."
