services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: src_db
      POSTGRES_USER: src_user
      POSTGRES_PASSWORD: src_pass
    volumes:
      - src_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U src_user -d src_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://src_user:src_pass@postgres:5432/src_db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ENABLE_OTEL: "true"
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:3000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token-change-me}
      RECOVERY_API_TOKEN: ${RECOVERY_API_TOKEN:-dev-recovery-token-change-me}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-dev-alert-webhook-token-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  responder:
    build:
      context: ./responder
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_BASE_URL: http://backend:8000
      GROQ_ENABLED: "false"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token-change-me}
      RECOVERY_API_TOKEN: ${RECOVERY_API_TOKEN:-dev-recovery-token-change-me}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-dev-alert-webhook-token-change-me}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_GRAFANA_URL: http://localhost:3000
        VITE_ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token-change-me}
        VITE_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/prometheus/alerts-demo.yml:/etc/prometheus/alerts-demo.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - otel-collector

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    depends_on:
      - responder

  tempo:
    image: grafana/tempo:2.6.1
    user: root
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  src_pgdata:
  tempo_data:
