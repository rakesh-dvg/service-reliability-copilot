global:
  resolve_timeout: 2m

route:
  receiver: src-responder
  group_by: ["alertname", "journey"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 2m

receivers:
  - name: src-responder
    webhook_configs:
      - url: http://responder:8080/webhook/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: dev-alert-webhook-token-change-me

inhibit_rules: []
